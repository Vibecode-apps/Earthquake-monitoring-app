<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Earthquake Power Monitor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ d, d2 }) => (
            <svg fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" width="24" height="24">
                <path d={d}/>{d2 && <path d={d2}/>}
            </svg>
        );

        const App = () => {
            const [quakes, setQuakes] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [filter, setFilter] = useState('all');
            const [range, setRange] = useState('day');

            useEffect(() => { loadData(); }, [range]);

            const loadData = async () => {
                setLoading(true);
                setError(null);
                const urls = {
                    hour: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson',
                    day:  'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',
                    week: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson',
                    month:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson'
                };
                try {
                    let data;
                    try {
                        const r = await fetch(urls[range]);
                        data = await r.json();
                    } catch {
                        const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(urls[range]));
                        data = await r.json();
                    }
                    const list = (data.features || [])
                        .filter(q => q && q.properties && q.properties.mag != null)
                        .map(q => {
                            const mag = q.properties.mag;
                            const energy = Math.pow(10, 4.8 + 1.5 * mag);
                            return {
                                id: q.id,
                                place: q.properties.place || 'Unknown',
                                mag,
                                time: new Date(q.properties.time),
                                energy,
                                power: energy / 60,
                                depth: (q.geometry && q.geometry.coordinates[2]) || 0
                            };
                        })
                        .sort((a, b) => b.time - a.time);
                    setQuakes(list);
                } catch (e) {
                    setError('Failed to load data. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const fmtPower = w => {
                if (w >= 1e15) return (w/1e15).toFixed(2) + ' PW';
                if (w >= 1e12) return (w/1e12).toFixed(2) + ' TW';
                if (w >= 1e9)  return (w/1e9).toFixed(2)  + ' GW';
                if (w >= 1e6)  return (w/1e6).toFixed(2)  + ' MW';
                if (w >= 1e3)  return (w/1e3).toFixed(2)  + ' kW';
                return w.toFixed(2) + ' W';
            };

            const fmtEnergy = j => {
                if (j >= 1e15) return (j/1e15).toFixed(2) + ' PJ';
                if (j >= 1e12) return (j/1e12).toFixed(2) + ' TJ';
                if (j >= 1e9)  return (j/1e9).toFixed(2)  + ' GJ';
                if (j >= 1e6)  return (j/1e6).toFixed(2)  + ' MJ';
                return (j/1e3).toFixed(2) + ' kJ';
            };

            const magColor = m => m >= 7 ? 'bg-red-500' : m >= 6 ? 'bg-orange-500' : m >= 5 ? 'bg-yellow-500' : m >= 4 ? 'bg-blue-500' : 'bg-gray-500';

            const timeAgo = d => {
                const s = Math.floor((new Date() - d) / 1000);
                if (s < 60) return s + 's ago';
                if (s < 3600) return Math.floor(s/60) + 'm ago';
                if (s < 86400) return Math.floor(s/3600) + 'h ago';
                return Math.floor(s/86400) + 'd ago';
            };

            const shown = quakes.filter(q =>
                filter === 'major' ? q.mag >= 5 :
                filter === 'moderate' ? q.mag >= 4 && q.mag < 5 :
                filter === 'minor' ? q.mag < 4 : true
            );

            const totalEnergy = shown.reduce((s, q) => s + q.energy, 0);
            const totalPower  = shown.reduce((s, q) => s + q.power, 0);
            const avgMag = shown.length ? shown.reduce((s, q) => s + q.mag, 0) / shown.length : 0;
            const strongest = shown.length ? Math.max(...shown.map(q => q.mag)) : 0;
            const households = Math.floor(totalEnergy / (1200 * 24));
            const cities = (totalPower / 500e6).toFixed(2);

            if (loading && !quakes.length) return (
                <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0f172a,#1e293b)',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <div style={{textAlign:'center'}}>
                        <div style={{fontSize:'48px',marginBottom:'16px'}}>🌍</div>
                        <p style={{fontSize:'20px'}}>Loading earthquake data...</p>
                    </div>
                </div>
            );

            return (
                <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0f172a,#1e293b)',color:'white',padding:'24px',fontFamily:'sans-serif'}}>
                    <div style={{maxWidth:'1200px',margin:'0 auto'}}>

                        <div style={{marginBottom:'32px'}}>
                            <h1 style={{fontSize:'32px',fontWeight:'bold',marginBottom:'8px'}}>🌍 Global Earthquake Energy Monitor</h1>
                            <p style={{color:'#94a3b8'}}>Real-time seismic activity with energy conversion analysis</p>
                        </div>

                        {error && (
                            <div style={{background:'rgba(239,68,68,0.2)',border:'1px solid #ef4444',borderRadius:'8px',padding:'16px',marginBottom:'24px'}}>
                                ⚠️ {error}
                            </div>
                        )}

                        <div style={{display:'flex',gap:'8px',marginBottom:'24px',flexWrap:'wrap'}}>
                            {['hour','day','week','month'].map(r => (
                                <button key={r} onClick={() => setRange(r)} style={{padding:'8px 16px',borderRadius:'8px',border:'none',cursor:'pointer',background: range===r ? '#2563eb' : '#334155',color:'white',fontWeight: range===r ? 'bold' : 'normal'}}>
                                    📅 Past {r.charAt(0).toUpperCase()+r.slice(1)}
                                </button>
                            ))}
                            <button onClick={loadData} style={{padding:'8px 16px',borderRadius:'8px',border:'none',cursor:'pointer',background:'#0f766e',color:'white',marginLeft:'auto'}}>
                                🔄 Refresh
                            </button>
                        </div>

                        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:'16px',marginBottom:'24px'}}>
                            {[
                                {label:'Total Events', value: shown.length, color:'#60a5fa'},
                                {label:'Total Energy',  value: fmtEnergy(totalEnergy), color:'#facc15'},
                                {label:'Avg Magnitude', value: avgMag.toFixed(2), color:'#34d399'},
                                {label:'Strongest',     value: strongest ? strongest.toFixed(1) : '-', color:'#fb923c'}
                            ].map(({label,value,color}) => (
                                <div key={label} style={{background:'rgba(30,41,59,0.8)',borderRadius:'12px',padding:'20px',border:'1px solid #334155'}}>
                                    <p style={{color:'#94a3b8',fontSize:'13px',marginBottom:'8px'}}>{label}</p>
                                    <p style={{fontSize:'28px',fontWeight:'bold',color}}>{value}</p>
                                </div>
                            ))}
                        </div>

                        <div style={{background:'linear-gradient(135deg,rgba(88,28,135,0.3),rgba(30,58,138,0.3))',borderRadius:'12px',padding:'24px',border:'1px solid rgba(139,92,246,0.4)',marginBottom:'24px'}}>
                            <h3 style={{fontSize:'18px',fontWeight:'bold',marginBottom:'16px'}}>⚡ Potential Energy Conversion Analysis</h3>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:'24px'}}>
                                <div>
                                    <p style={{color:'#94a3b8',fontSize:'13px',marginBottom:'4px'}}>Equivalent Power Output</p>
                                    <p style={{fontSize:'24px',fontWeight:'bold',color:'#facc15'}}>{fmtPower(totalPower)}</p>
                                    <p style={{color:'#475569',fontSize:'12px',marginTop:'4px'}}>if captured over 60 seconds</p>
                                </div>
                                <div>
                                    <p style={{color:'#94a3b8',fontSize:'13px',marginBottom:'4px'}}>Household Equivalent</p>
                                    <p style={{fontSize:'24px',fontWeight:'bold',color:'#34d399'}}>{households.toLocaleString()}</p>
                                    <p style={{color:'#475569',fontSize:'12px',marginTop:'4px'}}>homes powered for 24 hours</p>
                                </div>
                                <div>
                                    <p style={{color:'#94a3b8',fontSize:'13px',marginBottom:'4px'}}>City Power Equivalent</p>
                                    <p style={{fontSize:'24px',fontWeight:'bold',color:'#60a5fa'}}>{cities}</p>
                                    <p style={{color:'#475569',fontSize:'12px',marginTop:'4px'}}>cities @ 500MW each</p>
                                </div>
                            </div>
                        </div>

                        <div style={{display:'flex',gap:'8px',marginBottom:'16px',flexWrap:'wrap'}}>
                            {[['all','All'],['major','Major (5+)'],['moderate','Moderate (4-5)'],['minor','Minor (<4)']].map(([k,l]) => (
                                <button key={k} onClick={() => setFilter(k)} style={{padding:'8px 16px',borderRadius:'8px',border:'none',cursor:'pointer',background: filter===k ? '#2563eb' : '#334155',color:'white'}}>
                                    {l}
                                </button>
                            ))}
                        </div>

                        <div style={{background:'rgba(30,41,59,0.8)',borderRadius:'12px',border:'1px solid #334155',overflowX:'auto'}}>
                            <table style={{width:'100%',borderCollapse:'collapse'}}>
                                <thead>
                                    <tr style={{background:'rgba(15,23,42,0.8)'}}>
                                        {['Location','Magnitude','Energy','Power','Time'].map(h => (
                                            <th key={h} style={{padding:'16px',textAlign:'left',fontSize:'13px',color:'#94a3b8',fontWeight:'600'}}>{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody>
                                    {shown.slice(0,100).map((q,i) => (
                                        <tr key={q.id} style={{borderTop:'1px solid #1e293b',background: i%2===0 ? 'transparent' : 'rgba(15,23,42,0.3)'}}>
                                            <td style={{padding:'14px 16px',fontSize:'13px'}}>📍 {q.place}</td>
                                            <td style={{padding:'14px 16px'}}>
                                                <span style={{padding:'4px 10px',borderRadius:'20px',fontWeight:'bold',fontSize:'13px',background: q.mag>=7?'#ef4444':q.mag>=6?'#f97316':q.mag>=5?'#eab308':q.mag>=4?'#3b82f6':'#6b7280'}}>
                                                    {q.mag.toFixed(1)}
                                                </span>
                                            </td>
                                            <td style={{padding:'14px 16px',fontFamily:'monospace',fontSize:'13px'}}>{fmtEnergy(q.energy)}</td>
                                            <td style={{padding:'14px 16px',fontFamily:'monospace',fontSize:'13px'}}>⚡ {fmtPower(q.power)}</td>
                                            <td style={{padding:'14px 16px',fontSize:'13px',color:'#94a3b8'}}>{timeAgo(q.time)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div style={{marginTop:'24px',background:'rgba(30,41,59,0.8)',borderRadius:'12px',padding:'20px',border:'1px solid #334155'}}>
                            <h3 style={{fontWeight:'bold',marginBottom:'8px'}}>⚡ How Energy Conversion Works</h3>
                            <p style={{fontSize:'13px',color:'#94a3b8'}}>
                                Energy calculated using E = 10^(4.8 + 1.5M) joules. Power = Energy / 60 seconds. Households based on 1.2kW average for 24 hours. Note: theoretical calculations only — current technology cannot capture seismic energy for electricity.
                            </p>
                        </div>

                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
